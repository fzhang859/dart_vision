format:
  line_width: 100
  tab_size: 2
  use_tabchars: false
  line_ending: unix
  command_case: lower
  keyword_case: upper
  dangle_parens: true
  dangle_align: prefix
  enable_sort: false
  autosort: false

  # Keep set()/find_package() compact, but expand longer target/source lists.
  max_pargs_hwrap: 2
  max_subgroups_hwrap: 2
  max_rows_cmdline: 2

  always_wrap:
    - add_executable
    - add_library
    - target_include_directories
    - target_link_libraries
    - target_compile_definitions
    - target_compile_options
    - ament_target_dependencies
    - rosidl_generate_interfaces

parse:
  additional_commands:
    ament_target_dependencies:
      pargs:
        nargs: "*"
        flags:
          - SYSTEM
          - INTERFACE
          - PUBLIC
        max_pargs_hwrap: 1
      always_wrap: true

    rosidl_generate_interfaces:
      pargs: "*"
      kwargs:
        DEPENDENCIES: "*"
        ADD_LINTER_TESTS: 1
        SKIP_INSTALL: 1
      always_wrap: true

    rclcpp_components_register_nodes:
      pargs: "*"
      always_wrap: true
